<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src https: http:"
    />
    <title>Talkivio</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f8fb;
        --fg: #0f172a;
        --muted: #5b6577;
        --card: #ffffff;
        --line: #e3e8ef;
        --primary: #07778a;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b1120;
          --fg: #e8edf5;
          --muted: #9aa6b8;
          --card: #111a2e;
          --line: #1f2b44;
          --primary: #37e5e7;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
        font:
          15px/1.5 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      main {
        max-width: 420px;
        padding: 36px 32px;
        text-align: center;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
      }
      img {
        width: 56px;
        height: 56px;
      }
      h1 {
        font-size: 20px;
        margin: 16px 0 6px;
      }
      p {
        margin: 0 0 20px;
        color: var(--muted);
      }
      button {
        font: inherit;
        font-weight: 600;
        padding: 10px 22px;
        border: 0;
        border-radius: 10px;
        background: var(--primary);
        color: #fff;
        cursor: pointer;
      }
      @media (prefers-color-scheme: dark) {
        button {
          color: #04121a;
        }
      }
      small {
        display: block;
        margin-top: 14px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <img src="../assets/icon.png" alt="" />
      <h1>Can't reach Talkivio</h1>
      <p>Check your internet connection. Talkivio reconnects on its own as soon as it can.</p>
      <button id="retry" type="button">Try again</button>
      <small id="status" role="status" aria-live="polite"></small>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      const origin = params.get('origin') || 'https://talkivio.com';
      let target = origin + '/inbox';
      try {
        const u = new URL(params.get('url') || '');
        if (u.origin === origin) target = u.toString();
      } catch {}
      const status = document.getElementById('status');
      const go = () => {
        status.textContent = 'Connecting…';
        location.href = target;
      };
      document.getElementById('retry').addEventListener('click', go);
      // Retry on its own once the dashboard answers again.
      const probe = () =>
        fetch(origin + '/robots.txt', { mode: 'no-cors', cache: 'no-store' }).then(go, () => undefined);
      setInterval(probe, 5000);
      window.addEventListener('online', probe);
    </script>
  </body>
</html>
