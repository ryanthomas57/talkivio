components:
  schemas:
    Ok:
      type: object
      properties:
        ok:
          type: boolean
      required:
        - ok
    OkTrue:
      type: object
      properties:
        ok:
          type: boolean
          const: true
      required:
        - ok
    Accepted:
      type: object
      properties:
        accepted:
          type: boolean
      required:
        - accepted
    DownloadGrant:
      type: object
      properties:
        url:
          type: string
        method:
          type: string
          const: GET
        expires_at:
          type: string
          format: date-time
        filename:
          type: string
        mime:
          type: string
        size_bytes:
          type: integer
        sha256:
          type:
            - string
            - "null"
      required:
        - url
        - method
        - expires_at
        - filename
        - mime
        - size_bytes
        - sha256
    Me:
      type: object
      properties:
        user:
          type: object
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
            display_name:
              type: string
            avatar_url:
              type:
                - string
                - "null"
            email_verified:
              type: boolean
            mfa_enabled:
              type: boolean
            created_at:
              type: string
              format: date-time
          required:
            - id
            - email
            - display_name
            - avatar_url
            - email_verified
            - mfa_enabled
            - created_at
        memberships:
          type: array
          items:
            type: object
            properties:
              membership_id:
                type: string
                format: uuid
              tenant_id:
                type: string
                format: uuid
              tenant_name:
                type: string
              tenant_slug:
                type: string
              role:
                type: string
                enum:
                  - owner
                  - admin
                  - supervisor
                  - agent
                  - analyst
              enabled:
                type: boolean
              onboarding_completed:
                type: boolean
              plan:
                type: string
            required:
              - membership_id
              - tenant_id
              - tenant_name
              - tenant_slug
              - role
              - enabled
              - onboarding_completed
              - plan
        active_tenant_id:
          anyOf:
            - type: string
              format: uuid
            - type: "null"
      required:
        - user
        - memberships
        - active_tenant_id
    SignupResult:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        verification_required:
          type: boolean
        me:
          $ref: "#/components/schemas/Me"
      required:
        - user_id
        - tenant_id
        - verification_required
        - me
    AuthProviders:
      type: object
      properties:
        oauth:
          type: array
          items:
            type: string
            enum:
              - google
              - github
      required:
        - oauth
    AuthSession:
      type: object
      properties:
        id:
          type: string
          format: uuid
        browser:
          type:
            - string
            - "null"
        location:
          type:
            - string
            - "null"
        last_active_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        current:
          type: boolean
      required:
        - id
        - browser
        - location
        - last_active_at
        - created_at
        - current
    RevokedCount:
      type: object
      properties:
        revoked:
          type: integer
      required:
        - revoked
    MfaEnrollment:
      type: object
      properties:
        enrollment_id:
          type: string
        secret:
          type: string
        otpauth_url:
          type: string
        qr_data_url:
          type: string
      required:
        - enrollment_id
        - secret
        - otpauth_url
        - qr_data_url
    RecoveryCodes:
      type: object
      properties:
        recovery_codes:
          type: array
          items:
            type: string
      required:
        - recovery_codes
    OrgSettings:
      type: object
      properties:
        routing:
          type: object
          properties:
            mode:
              type: string
              enum:
                - BROADCAST
                - ASSIGNED
            max_chats_per_agent:
              anyOf:
                - type: integer
                - type: "null"
            reassign_after_seconds:
              type: number
            strict_departments:
              type: boolean
          required:
            - mode
            - max_chats_per_agent
            - reassign_after_seconds
            - strict_departments
        chat:
          type: object
          properties:
            idle_timeout_minutes:
              type: number
            missed_after_seconds:
              type: number
            agent_auto_away_minutes:
              type: number
            allow_visitor_end_chat:
              type: boolean
            request_rating_on_end:
              type: boolean
            mask_credit_cards:
              type: boolean
            allow_attachments:
              type: boolean
            max_attachment_mb:
              type: number
            allowed_file_types:
              type: array
              items:
                type: string
            show_typing_preview:
              type: boolean
            read_receipts:
              type: boolean
            reconnect_grace_seconds:
              type: number
            offer_offline_after_seconds:
              type: number
          required:
            - idle_timeout_minutes
            - missed_after_seconds
            - agent_auto_away_minutes
            - allow_visitor_end_chat
            - request_rating_on_end
            - mask_credit_cards
            - allow_attachments
            - max_attachment_mb
            - allowed_file_types
            - show_typing_preview
            - read_receipts
            - reconnect_grace_seconds
            - offer_offline_after_seconds
        tracking:
          type: object
          properties:
            analytics_consent_required:
              type: boolean
            query_allowlist:
              type: array
              items:
                type: string
            retain_ip:
              type: boolean
            location_enabled:
              type: boolean
            page_event_retention_days:
              type: number
          required:
            - analytics_consent_required
            - query_allowlist
            - retain_ip
            - location_enabled
            - page_event_retention_days
        availability:
          type: object
          properties:
            default_schedule_id:
              anyOf:
                - type: string
                  format: uuid
                - type: "null"
          required:
            - default_schedule_id
        offline:
          type: object
          properties:
            rate_limit_per_hour:
              type: number
          required:
            - rate_limit_per_hour
        analytics:
          type: object
          properties:
            exclude_quick_cancellations:
              type: boolean
          required:
            - exclude_quick_cancellations
        files:
          type: object
          properties:
            daily_quota_mb:
