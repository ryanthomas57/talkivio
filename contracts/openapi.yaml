        - PLAN_LIMIT
        - INTERNAL
      description: "Stable machine codes (ch. 76 inventory: AUTH_REQUIRED, MFA_REQUIRED, TOKEN_EXPIRED, TOKEN_USED, VALIDATION_FAILED, ORIGIN_NOT_ALLOWED, CONSENT_REQUIRED, PERMISSION_DENIED, NOT_FOUND, VERSION_CONFLICT, IDEMPOTENCY_MISMATCH, CHAT_CLOSED, CAPACITY_EXCEEDED, OFFER_EXPIRED, OFFER_WITHDRAWN, DEPARTMENT_UNAVAILABLE, QUEUE_FULL, FILE_TOO_LARGE, FILE_TYPE_BLOCKED, FILE_SCAN_PENDING, FILE_REJECTED, EXPORT_EXPIRED, RATE_LIMITED, CURSOR_EXPIRED, SERVICE_UNAVAILABLE, INTEGRATION_UNAVAILABLE; plus server extensions). Human messages localize; `retryable` only means a retry with the same command identity may help."
    ErrorEnvelope:
      type: object
      required:
        - error
        - meta
      properties:
        error:
          type: object
          required:
            - code
            - message
            - retryable
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: string
            retryable:
              type: boolean
            field_errors:
              type: object
              description: snake_case field path → messages (opaque map)
              additionalProperties:
                type: array
                items:
                  type: string
            details:
              description: Safe structured context (e.g. current version on VERSION_CONFLICT)
        meta:
          type: object
          properties:
            request_id:
              type: string
  responses:
    BadRequest:
      description: Malformed JSON or path parameter (e.g. a non-UUID id) — `VALIDATION_FAILED`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: Not authenticated (`AUTH_REQUIRED`, `TOKEN_EXPIRED`, …).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: "Authenticated but not allowed: missing permission or CSRF token (`PERMISSION_DENIED`), `RECENT_AUTH_REQUIRED`, `MFA_REQUIRED`, `ORIGIN_NOT_ALLOWED`, `CONSENT_REQUIRED`."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Unknown or hidden object (sensitive existence is always 404).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: Version, idempotency or state conflict (`VERSION_CONFLICT`, `IDEMPOTENCY_MISMATCH`, `CAPACITY_EXCEEDED`, `CHAT_CLOSED`, `OFFER_WITHDRAWN`, …).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: CAPACITY_EXCEEDED
              message: Your chat capacity is full.
              retryable: false
            meta:
              request_id: req-2f77
    ValidationFailed:
      description: Request does not match the schema (`VALIDATION_FAILED` with `field_errors`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: VALIDATION_FAILED
              message: Check the highlighted fields.
              retryable: false
              field_errors:
                email:
                  - Enter a valid email address.
            meta:
              request_id: req-98bc
    PreconditionRequired:
      description: "`If-Match` / `expected_version` missing on a versioned write (`PRECONDITION_REQUIRED`)."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RateLimited:
      description: Rate limited (`RATE_LIMITED`); honour `Retry-After`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
      headers:
        Retry-After:
          description: Seconds to wait
          schema:
            type: integer
    Error:
      description: Unexpected error (`INTERNAL`, `SERVICE_UNAVAILABLE`, `INTEGRATION_UNAVAILABLE`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: "Command idempotency (ch. 40): same key + same payload replays the original status and body for 24 h; same key + different payload → 409 `IDEMPOTENCY_MISMATCH`."
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: ^[\w-]+$
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: Entity version precondition (`3`, `"3"` or `W/"3"`); alternatively send `expected_version` in the body. Missing on a required write → 428, stale → 409.
      schema:
        type: string
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: rd_session
      description: Dashboard session (HttpOnly). The active tenant comes from the server-side session.
    csrfToken:
      type: apiKey
      in: header
      name: x-csrf-token
      description: Session-bound CSRF token (value of the `rd_csrf` cookie); required on every non-GET request made with a session.
    integrationToken:
      type: http
      scheme: bearer
      bearerFormat: rdt_…
      description: Tenant integration token; accepted only on operations marked `x-talkivio-token-access`.
    visitorCapability:
      type: http
      scheme: bearer
      bearerFormat: rdv1.…
      description: Short-lived visitor capability from `POST /widget/v1/sessions` (scoped to tenant/site/visitor/session).
    identityJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Customer-backend JWT signed with the source site identity secret (aud "talkivio handoff").
