<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Account — Northwind Goods (demo)</title>
  <link rel="stylesheet" href="/demo.css" />
  <!-- Talkivio embed snippet (the loader tag itself is injected by /demo.js with the chosen site key) -->
  <script>window.Talkivio = window.Talkivio || function () { (window.Talkivio.q = window.Talkivio.q || []).push(arguments); };</script>
  <script src="/demo.js"></script>
  <script src="/spa.js" defer></script>
</head>
<body>
  <header class="site">
    <a class="logo" href="/index.html">Northwind <span>Goods</span></a>
    <nav class="site" aria-label="Main">
      <a href="/index.html">Shop</a>
      <a href="/product.html">Product</a>
      <a href="/pricing.html">Pricing</a>
      <a href="/app.html" aria-current="page">Account (SPA)</a>
    </nav>
  </header>
  <main>
    <section class="hero">
      <h1 id="spa-title">Your account</h1>
      <p>A single-page app section: these tabs use <code>history.pushState</code>, so the loader reports page views without reloads.</p>
    </section>
    <nav aria-label="Account sections" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px">
      <button class="btn secondary" type="button" data-view="overview">Overview</button>
      <button class="btn secondary" type="button" data-view="orders">Orders</button>
      <button class="btn secondary" type="button" data-view="returns">Returns</button>
      <button class="btn secondary" type="button" data-view="settings">Settings</button>
    </nav>
    <section class="card" id="spa-view" aria-live="polite"></section>
    <section class="console" aria-labelledby="console-title">
      <h2 id="console-title">SDK console</h2>
      <p class="muted">Calls <code>Talkivio(command, ...)</code> on this page. Events appear below.</p>
      <div class="row">
        <button type="button" data-sdk="open">open</button>
        <button type="button" data-sdk="close">close</button>
        <button type="button" data-sdk="hide">hide</button>
        <button type="button" data-sdk="show">show</button>
        <button type="button" data-sdk="identify" data-arg='{"name":"Pat Demo","email":"pat@example.com"}'>identify</button>
        <button type="button" data-sdk="setTags" data-arg='["demo","vip"]'>setTags</button>
        <button type="button" data-sdk="setCustomFields" data-arg='{"plan":"pro","cartValue":129}'>setCustomFields</button>
        <button type="button" data-sdk="setLocale" data-arg='"ar"'>setLocale ar</button>
        <button type="button" data-sdk="setLocale" data-arg='"en"'>setLocale en</button>
        <button type="button" data-sdk="startChat" data-arg='{"message":"Hi! I have a question about my order."}'>startChat</button>
        <button type="button" data-sdk="endChat">endChat</button>
        <button type="button" data-sdk="getState">getState</button>
        <button type="button" data-sdk="resetIdentity">resetIdentity</button>
      </div>
      <pre id="sdk-log" aria-live="off"></pre>
    </section>
  </main>
</body>
</html>
