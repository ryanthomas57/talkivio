# Generated from docs/operations/alerts.md — keep both in sync. Runbooks: docs/operations/runbooks.md.
groups:
  - name: talkivio-slo
    rules:
      - record: talkivio:command_errors:ratio_rate5m
        expr: |
          sum(rate(talkivio_commands_total{outcome=~"server_error|dependency_error"}[5m]))
          / clamp_min(sum(rate(talkivio_commands_total{outcome!~"validation|denied|rate_limited"}[5m])), 1e-9)
      - record: talkivio:command_errors:ratio_rate1h
        expr: |
          sum(rate(talkivio_commands_total{outcome=~"server_error|dependency_error"}[1h]))
          / clamp_min(sum(rate(talkivio_commands_total{outcome!~"validation|denied|rate_limited"}[1h])), 1e-9)
      - record: talkivio:command_errors:ratio_rate30m
        expr: |
          sum(rate(talkivio_commands_total{outcome=~"server_error|dependency_error"}[30m]))
          / clamp_min(sum(rate(talkivio_commands_total{outcome!~"validation|denied|rate_limited"}[30m])), 1e-9)
      - record: talkivio:command_errors:ratio_rate6h
        expr: |
          sum(rate(talkivio_commands_total{outcome=~"server_error|dependency_error"}[6h]))
          / clamp_min(sum(rate(talkivio_commands_total{outcome!~"validation|denied|rate_limited"}[6h])), 1e-9)
      - record: talkivio:command_errors:ratio_rate3d
        expr: |
          sum(rate(talkivio_commands_total{outcome=~"server_error|dependency_error"}[3d]))
          / clamp_min(sum(rate(talkivio_commands_total{outcome!~"validation|denied|rate_limited"}[3d])), 1e-9)

      # 99.9 % objective → error budget 0.001; burn = ratio / 0.001.
      - alert: TalkivioErrorBudgetBurnFast
        expr: talkivio:command_errors:ratio_rate1h / 0.001 > 14.4 and talkivio:command_errors:ratio_rate5m / 0.001 > 14.4
        labels: { severity: page, runbook: RB-01 }
        annotations: { summary: 'Error budget burning > 14.4× (1 h and 5 m)' }
      - alert: TalkivioErrorBudgetBurnSlow
        expr: talkivio:command_errors:ratio_rate6h / 0.001 > 6 and talkivio:command_errors:ratio_rate30m / 0.001 > 6
        labels: { severity: page, runbook: RB-01 }
        annotations: { summary: 'Error budget burning > 6× (6 h and 30 m)' }
      - alert: TalkivioErrorBudgetBurnTicket
        expr: talkivio:command_errors:ratio_rate3d / 0.001 > 1 and talkivio:command_errors:ratio_rate6h / 0.001 > 1
        labels: { severity: ticket, runbook: RB-01 }
        annotations: { summary: 'Error budget burning > 1× (3 d and 6 h)' }

      - alert: TalkivioSendLatency
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(talkivio_message_delivery_seconds_bucket[5m]))) > 0.5
          or histogram_quantile(0.99, sum by (le) (rate(talkivio_message_delivery_seconds_bucket[5m]))) > 2
        for: 15m
        labels: { severity: ticket, runbook: RB-02 }
        annotations: { summary: 'Message commit → emit p95 > 0.5 s or p99 > 2 s' }
      - alert: TalkivioRestLatency
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(talkivio_http_request_duration_seconds_bucket{route_group!="export"}[5m]))) > 0.3
          or histogram_quantile(0.99, sum by (le) (rate(talkivio_http_request_duration_seconds_bucket{route_group!="export"}[5m]))) > 1
        for: 15m
        labels: { severity: ticket, runbook: RB-01 }
        annotations: { summary: 'REST p95 > 300 ms or p99 > 1 s' }
      - alert: TalkivioMessagePublishLag
        expr: max(talkivio_outbox_oldest_unpublished_seconds) > 30
        for: 5m
        labels: { severity: page, runbook: RB-03 }
        annotations: { summary: 'Outbox events unpublished for > 30 s' }
      # The DB-derived gauges are dropped (not frozen) when their snapshot query fails, so a database outage
      # shows up here instead of as a stale "0 s" lag.
      - alert: TalkivioOperationalSignalsAbsent
        expr: absent(talkivio_outbox_oldest_unpublished_seconds)
        for: 5m
        labels: { severity: page, runbook: RB-04 }
        annotations: { summary: 'Database-derived gauges absent (snapshot query failing or every target down)' }
      - alert: TalkivioRoutingQueueAge
        expr: max(talkivio_routing_queue_oldest_seconds{routable="true"}) > 180
        for: 2m
        labels: { severity: page, runbook: RB-05 }
        annotations: { summary: 'A routable chat has waited > 180 s' }
      - alert: TalkivioScanBacklog
        expr: max(talkivio_scan_backlog_seconds) > 300
        for: 5m
        labels: { severity: page, runbook: RB-06 }
        annotations: { summary: 'Uploads awaiting a scan verdict for > 5 min' }
      - alert: TalkivioMonitorStale
        expr: max(talkivio_monitor_freshness_seconds) > 15
        for: 5m
        labels: { severity: ticket, runbook: RB-05 }
        annotations: { summary: 'Supervisor monitor snapshots older than 15 s' }
      - alert: TalkivioReconnectStorm
        expr: sum(rate(talkivio_socket_reconnects_total[5m])) > 5 * sum(rate(talkivio_socket_reconnects_total[1d] offset 1d))
        for: 5m
        labels: { severity: page, runbook: RB-02 }
        annotations: { summary: 'Socket reconnects > 5× the 1-day baseline' }
